<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — shove.95</title>
<!--
  Hand-written rather than a gem theme: this is two pages, and a theme would
  add a build dependency and a sidebar full of download buttons that a privacy
  policy has no use for. Plain system type, because the Win95 costume belongs
  in the app, not on a legal page someone is trying to read.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 42rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 5rem;
    color: #1a1a1a;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #16181c; }
    a { color: #7ab7ff; }
    hr { border-color: #333; }
  }
  h1 { font-size: 1.85rem; line-height: 1.2; margin: 0 0 .4rem; }
  h2 { font-size: 1.1rem; margin: 2.25rem 0 .6rem; }
  ul { padding-left: 1.2rem; }
  li { margin: .25rem 0; }
  a { color: #0b57d0; }
  hr { border: 0; border-top: 1px solid #e3e3e3; margin: 2.5rem 0 1.25rem; }
  footer { font-size: .85rem; opacity: .7; }
</style>
</head>
<body>
{{ content }}
<hr>
<footer>
  shove.95 · <a href="https://github.com/lucasmaher-hash/shove-95">source on GitHub</a>
</footer>
</body>
</html>
